[package]
name = "dcterminal"
version = "0.1.0"
description = "Role-aware multi-tab UI for the Cursor CLI (ACP)"
authors = ["JT Francisco"]
edition = "2021"
default-run = "dcterminal"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dcterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["fake-claude"]
# Builds the `fake_claude` test bin (see its `[[bin]]` below).
fake-claude = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = "8"
# ClickUp (src/clickup): blocking HTTPS on worker threads, since the app has
# no async runtime of its own, and the token in the OS keychain.
# ~3.5: clickup/transport.rs wraps ureq's resolver and connector, which are its
# `unversioned` API and may change in a minor release (C3).
ureq = { version = "~3.5", default-features = false, features = ["rustls"] }
keyring = "4"

# Already built through tao; used for `applicationShouldTerminate:` (src/macos_terminate.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[[bin]]
name = "build_roles_seed"
path = "src/bin/build_roles_seed.rs"

# A stand-in for the `claude` CLI that `tests/fake_claude.rs` runs in a PTY.
# `tauri build` copies every `[[bin]]` into the app bundle, except one whose
# `required-features` were not passed to it with `--features`; the feature is
# on by default so plain `cargo test` still builds the bin.
[[bin]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"
required-features = ["fake-claude"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
